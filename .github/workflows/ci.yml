name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nf
          POSTGRES_PASSWORD: nf
          POSTGRES_DB: new_foundations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nf -d new_foundations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://nf:nf@127.0.0.1:5432/new_foundations
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: |
          node --test tests/secret-scan.test.mjs
          node tests/secret-scan.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Rules coverage
        run: pnpm test:coverage

      - name: API integration tests
        run: pnpm test:integration

      - name: API integration tests with pepper
        run: pnpm test:integration
        env:
          SESSION_PEPPER: ci-test-pepper

      - name: API Docker health check
        run: |
          docker build -f apps/api/Dockerfile -t nf-api-ci .
          docker run -d --name nf-api-ci --network host -e DATABASE_URL="$DATABASE_URL" nf-api-ci
          trap 'docker logs nf-api-ci; docker rm -f nf-api-ci' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/healthz; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Vite build
        run: pnpm --filter @nf/web build

      - name: Install Playwright browser
        run: pnpm --filter @nf/web exec playwright install --with-deps chromium

      - name: Playwright smoke
        run: pnpm --filter @nf/web test:e2e

      - name: Upload NF-20 benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf20-benchmark
          path: apps/web/test-results/**/nf20-benchmark.json
          if-no-files-found: warn
